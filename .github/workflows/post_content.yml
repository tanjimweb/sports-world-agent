name: Post Scheduled Content

on:
  schedule:
    - cron: '30 2 * * *'
    - cron: '30 6 * * *'
    - cron: '30 10 * * *'
    - cron: '30 14 * * *'
    - cron: '30 17 * * *'
  workflow_dispatch:
    inputs:
      post_index:
        description: 'Which post slot to send (1-5)'
        required: true
        default: '1'

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Determine post index
        id: determine
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "post_index=${{ github.event.inputs.post_index }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "30 2 * * *") echo "post_index=1" >> "$GITHUB_OUTPUT" ;;
              "30 6 * * *") echo "post_index=2" >> "$GITHUB_OUTPUT" ;;
              "30 10 * * *") echo "post_index=3" >> "$GITHUB_OUTPUT" ;;
              "30 14 * * *") echo "post_index=4" >> "$GITHUB_OUTPUT" ;;
              "30 17 * * *") echo "post_index=5" >> "$GITHUB_OUTPUT" ;;
              *) echo "post_index=1" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POST_INDEX: ${{ steps.determine.outputs.post_index }}
        run: |
          python scripts/telegram_poster.py

      - name: Send to Facebook
        continue-on-error: true
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          POST_INDEX: ${{ steps.determine.outputs.post_index }}
        run: |
          python scripts/facebook_poster.py

      - name: Commit updated status
        run: |
          git config user.name "sports-world-bot"
          git config user.email "actions@github.com"
          git add data/images/manifest.json
          git diff --quiet --cached || git commit -m "Mark slot ${{ steps.determine.outputs.post_index }} as posted"
          git push
